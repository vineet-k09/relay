[project]
name = "relay"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vineet Kushwaha", email = "vineet.kushwaha1@vodafone.com" }
]
requires-python = ">=3.12"
dependencies = [
    "blake3>=1.0.11",
    "google-cloud-storage>=3.17.1",
]

[project.scripts]
relay = "relay.cli:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0", "hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes: unused imports, undefined names
    "I",      # isort: import ordering
    "B",      # flake8-bugbear: common bugs
    "UP",     # pyupgrade: modern Python syntax
    "SIM",    # simplify code
    "RUF",    # Ruff-specific rules
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
